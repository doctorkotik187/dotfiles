# Tool: soar (https://github.com/pkgforge/soar) — Package manager for standalone binary packages

[packages]
soar            = "*"  # package manager that manages itself
mise            = "*"  # "THE PLUG"
uad-ng          = "*"  # strips OEM bloatware off android phones, hopefully without bricking them
streamlink      = "*"  # pipes video streams into mpv, because browser video players are bloat
mpv             = "*"  # media player for people who hate VLC skins and love keyboard shortcuts
ffmpeg          = "*"  # swiss army chainsaw for video and audio formats
yt-dlp          = "*"  # media downloader, allegedly for archival purposes

# Fun ---------------------------------------------------------
cpufetch        = "*"  # ascii art for your CPU cache hierarchy and socket pinout
albafetch       = "*"  # c-based neofetch alternative, because shell scripts took 2 whole milliseconds

[packages.waveterm]
github        = "wavetermdev/waveterm"
asset_pattern = "*linux-x64*.zip"
entrypoint    = "waveterm"
sandbox       = { enabled = false }
hooks         = { post_extract = """
cat << 'EOF' > "$INSTALL_DIR/waveterm.desktop"
[Desktop Entry]
Name=Wave Terminal
Comment=AI-integrated, cross-platform terminal
Exec=waveterm %U
Icon=wave-logo-256-soar
Terminal=false
Type=Application
Categories=System;TerminalEmulator;
StartupWMClass=Wave
EOF
""" }
version = "0.14.5"

[packages.wezterm]
github             = "wezterm/wezterm"
tag_pattern        = "nightly"
include_prerelease = true
asset_pattern      = "*Ubuntu26.04.tar.xz"
extract_root       = "wezterm"
binaries = [
  { source = "usr/bin/wezterm", link_as = "wezterm" },
  { source = "usr/bin/wezterm-gui", link_as = "wezterm-gui" },
  { source = "usr/bin/wezterm-mux-server", link_as = "wezterm-mux-server" },
  { source = "usr/bin/strip-ansi-escapes", link_as = "strip-ansi-escapes" },
]
version = "nightly"
