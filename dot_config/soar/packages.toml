# Tool: soar (https://github.com/pkgforge/soar) — Package manager for standalone binary packages

[packages]
uad-ng          = "*"  # strips OEM bloatware off android phones, hopefully without bricking them
streamlink      = "*"  # pipes video streams into mpv, because browser video players are bloat
mpv             = "*"  # media player for people who hate VLC skins and love keyboard shortcuts
ffmpeg          = "*"  # swiss army chainsaw for video and audio formats
yt-dlp          = "*"  # media downloader, allegedly for archival purposes
macchina        = "*"  # fast sysinfo fetcher, for when your terminal starts faster than your thoughts
cpufetch        = "*"  # ascii art for your CPU cache hierarchy and socket pinout
albafetch       = "*"  # c-based neofetch alternative, because shell scripts took 2 whole milliseconds
