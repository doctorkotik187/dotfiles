# Tool: mise (https://mise.jdx.dev/) — Dev tool version manager and environment organizer

[settings]
auto_update=true

[tools]
# CLI APPS ################################################

# Terminal & Shell ------------------------------------------
nushell                                                       = "latest"  # shell for people who think bash syntax is a personality flaw
starship                                                      = "latest"  # prompt that costs more compute than the shell itself
zoxide                                                        = "latest"  # cd but it remembers where you live better than you do
fzf                                                           = "latest"  # fuzzy finder, turns "where did I put that" into a keystroke
gum                                                           = "latest"  # glamorous shell scripts, because bash deserves better
herdr                                                         = "latest"  # terminal multiplexer

# Editor & Code Intelligence -----------------------------------
neovim                                                        = "latest"  # extensible modal text editor
ast-grep                                                      = "latest"  # structural code search and linting
tree-sitter                                                   = "latest"  # parser generator tool and incremental parsing library

# Files & Disk -----------------------------------------------
bat                                                           = "latest"  # cat, but it read a design book
eza                                                           = "latest"  # ls, but it went outside once
fd                                                            = "latest"  # find, minus the incantations
ripgrep                                                       = "latest"  # grep, but it actually respects your time
ripgrep-all                                                   = "latest"  # ripgrep for pdfs and archives, so nothing can hide from you
sd                                                            = "latest"  # sed without needing a priesthood to decode it
dust                                                          = "latest"  # disk usage analyzer, tells you exactly who's the culprit
dua                                                           = "latest"  # disk usage analyzer, for reclaiming your gigabytes
yazi                                                          = "latest"  # file manager for people allergic to GUIs
7zip                                                          = "latest"  # the one archive tool to rule them all
gocryptfs                                                     = "latest"  # encrypted filesystem, for your trust issues
"aqua:ouch-org/ouch"                                          = "latest"  # decompress anything without memorizing 20 flag combos
"aqua:Canop/dysk"                                             = "latest"  # mounted disks and free space with filesystem info

# Git & Version Control ---------------------------------------
jj                                                            = "latest"  # jujutsu, in case we need to do a risky git operation
gh                                                            = "latest"  # github cli, for avoiding the website
lazygit                                                       = "latest"  # git tui, for avoiding git
delta                                                         = "latest"  # git diff pager that makes diffs look intentional
lefthook                                                      = "latest"  # fast git hooks manager that actually runs
pre-commit                                                    = "latest"  # some other git hooks manager (just to have all)
git-cliff                                                     = "latest"  # changelog generator from conventional commits
git-town                                                      = "latest"  # generic, high-level git workflow engine
gitleaks                                                      = "latest"  # detect secrets and passwords in git repos
actionlint                                                    = "latest"  # static checker for github actions workflows
chezmoi                                                       = "latest"  # dotfiles manager, the reason this file exists
difftastic                                                    = "latest"  # structural syntax-aware diff tool
zizmor                                                        = "latest"  # static analysis tool for github actions
"aqua:tummychow/git-absorb"                                   = "latest"  # git commit --fixup made easy

# System & Monitoring ------------------------------------------
bottom                                                        = "latest"  # system monitor, htop's cooler cousin
fastfetch                                                     = "latest"  # system info, for flexing your specs in screenshots
watchexec                                                     = "latest"  # file watcher, runs your command so you don't have to
hyperfine                                                     = "latest"  # command-line benchmarking tool
tokei                                                         = "latest"  # code statistics, counts how much technical debt you have
syncthing                                                     = "latest"  # file sync without asking a cloud company nicely
lazyssh                                                       = "latest"  # ssh tui, for people who forgot every hostname
hcloud                                                        = "latest"  # hetzner cloud cli
podman-tui                                                    = "latest"  # terminal ui for podman containers and pods
"pipx:podman-compose"                                         = "latest"  # compose specification runner for podman
"github:docker/docker-credential-helpers"                     = { version = "latest", asset_pattern = "*secretservice*linux-amd64", rename_exe = "docker-credential-secretservice" }  # official docker secret-service helper

# Docs, Data & Text --------------------------------------------
marp-cli                                                      = "latest"  # presentations with markdown
pandoc                                                        = "latest"  # document converter, the universal translator
typst                                                         = "latest"  # typesetting without LaTeX's decade-long learning curve
glow                                                          = "latest"  # markdown reader, for people who read READMEs
jq                                                            = "latest"  # json processor, the duct tape of the terminal
yq                                                            = "latest"  # yq is jq's yaml-flavored sibling
hledger                                                       = "latest"  # plain-text accounting, for spreadsheet refugees
protoc                                                        = "latest"  # protocol buffers compiler
hexyl                                                         = "latest"  # colored command-line hex viewer
markdownlint-cli2                                             = "latest"  # markdown linter, enforces formatting rules
taplo                                                         = "latest"  # toml toolkit, formatter, and linter
yamlfmt                                                       = "latest"  # extensible yaml formatter
usql                                                          = "latest"  # universal sql cli client
sqlite                                                        = "latest"  # the database, that is just a file
postgres                                                      = "latest"  # relational database management system
just                                                          = "latest"  # task runner, make without the whitespace trauma

# Media, network & API -------------------------------------------
yt-dlp                                                        = "latest"  # media downloader, allegedly for archival purposes
xh                                                            = "latest"  # friendly and fast tool for sending http requests
websocat                                                      = "latest"  # netcat for websockets
ffmpeg                                                        = "latest"  # media swiss army knife
oxipng                                                        = "latest"  # multithreaded png optimizer
"github:Wraient/curd"                                         = "latest"  # uwu
"github:fathyb/carbonyl"                                      = "latest"  # cli web browser

# Security & Crypto ----------------------------------------------
age                                                           = "latest"  # file encryption without a PhD requirement
osv-scanner                                                   = "latest"  # vulnerability scanner using google osv database
"github:olastor/age-plugin-fido2-hmac"                        = "latest"  # use age with solokey

# AI agents & Isolation -----------------------------------------
oh-my-pi                                                      = { version = "latest", rename_exe = "omp" }  # pi with batteries included
"aqua:smol-machines/smolvm"                                   = "latest"  # microvm sandbox runtime
ollama                                                        = "latest"  # we love lamas!

# Misc & Fun ----------------------------------------------------
mermaid-ascii                                                 = "latest"  # diagrams, but make them ascii
hadolint                                                      = "latest"  # dockerfile linter
shfmt                                                         = "latest"  # shell script parser and formatter
typos                                                         = "latest"  # fast source code spell checker for whole repos
yamllint                                                      = "latest"
"github:pkgforge/soar"                                        = "latest"  # package manager for packages the package manager doesn't have
"github:Veirt/weathr"                                         = "latest"  # terminal weather app, because opening a browser is too much effort

# "Good Boy" "Agile" "Productivity" tools ------------------------
"aqua:ankitpokhrel/jira-cli"                                  = "latest"  # lets the ai agent poke at jira
"npm:confluence-cli"                                          = "latest"  # lets the ai agent poke at confluence

# LANGUAGE RUNTIMES ######################################

clojure                                                       = "latest"  # lisp that insists parentheses are a feature
go                                                            = "latest"  # runtime with a gopher mascot and opinions about gofmt
java                                                          = "latest"  # runtime, bring your own 40 lines of boilerplate
kotlin                                                        = { version = "latest", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }
node                                                          = "latest"  # runtime that turned a browser scripting language into a backend
python                                                        = "latest"  # runtime that ships two package managers and still can't pick one
rust                                                          = "latest"  # runtime where the compiler is also your therapist
lua                                                           = "latest"  # runtime so small it fits inside a game engine's coat pocket

# LANGUAGE & FRAMEWORK SPECIFIC TOOLS ####################

# Python ---------------------------------------------------
uv                                                            = "latest"  # fast python package manager
ruff                                                          = "latest"  # python linter and formatter
ty                                                            = "latest"  # python type checker
"npm:basedpyright"                                            = "latest"  # python language server

# Rust -----------------------------------------------------
cargo-binstall                                                = "latest"  # let cargo install binaries (just in case)
rust-analyzer                                                 = "latest"  # rust language server

# Go -------------------------------------------------------
golangci-lint                                                 = "latest"  # fast linters runner for go
golangci-lint-langserver                                      = "latest"  # language server for golangci-lint
gofumpt                                                       = "latest"  # stricter gofmt
gotestsum                                                     = "latest"  # go test runner with rich summary output
"go:golang.org/x/tools/gopls"                                 = "latest"  # go language server
"aqua:go-delve/delve"                                         = "latest"  # go debugger

# Java -----------------------------------------------------
google-java-format                                            = "latest"  # java code formatter

# Kotlin ---------------------------------------------------
ktlint                                                        = "latest"  # kotlin linter and formatter

# Android --------------------------------------------------
android-sdk                                                   = "latest"  # sdkmanager, avdmanager, cmdline-tools
android-cli                                                   = { version = "latest", bin = "android", version_list_url = "https://dl.google.com/android/cli/latest/debian/dists/stable/main/binary-amd64/Packages", version_regex = '(?m)^Version: (\S+)$', platforms = { linux-x64 = { checksum_url = "https://dl.google.com/android/cli/{{ version }}/linux_x86_64/android.sha256", url = "https://dl.google.com/android/cli/{{ version }}/linux_x86_64/android" }, macos-arm64 = { checksum_url = "https://dl.google.com/android/cli/{{ version }}/darwin_arm64/android.sha256", url = "https://dl.google.com/android/cli/{{ version }}/darwin_arm64/android" }, macos-x64 = { checksum_url = "https://dl.google.com/android/cli/{{ version }}/darwin_x86_64/android.sha256", url = "https://dl.google.com/android/cli/{{ version }}/darwin_x86_64/android" }, windows-arm64 = { bin = "android.exe", checksum_url = "https://dl.google.com/android/cli/{{ version }}/windows_x86_64/android.exe.sha256", url = "https://dl.google.com/android/cli/{{ version }}/windows_x86_64/android.exe" }, windows-x64 = { bin = "android.exe", checksum_url = "https://dl.google.com/android/cli/{{ version }}/windows_x86_64/android.exe.sha256", url = "https://dl.google.com/android/cli/{{ version }}/windows_x86_64/android.exe" } } }

# TypeScript & Web -----------------------------------------
biome                                                         = "latest"  # toolchain for web projects (formatter, linter)
oxlint                                                        = "latest"  # fast javascript/typescript linter
prettier                                                      = "latest"  # opinionated code formatter
"npm:typescript"                                              = "latest"  # typescript compiler & tsserver
"npm:@vtsls/language-server"                                  = "latest"  # typescript language server

# Lua ------------------------------------------------------
lua-language-server                                           = "latest"  # lua language server
stylua                                                        = "latest"  # lua code formatter

# Clojure --------------------------------------------------
babashka                                                      = "latest"  # clojure scripting
clj-kondo                                                     = "latest"  # clojure linter
"github:clojure-lsp/clojure-lsp"                              = "latest"  # clojure language server
"github:weavejester/cljfmt"                                   = "latest"  # clojure formatter
