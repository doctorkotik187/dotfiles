[tools]
"github:Wraient/curd"                                         = "latest"  # uwu
"github:olastor/age-plugin-fido2-hmac"                        = "latest"  # use age with solokey
"cargo:solo2"                                                 = "latest"  # fandeso saifu desu

[vars]
secret_cache_ttl = "30s"

[env]
# Core -----------------------------------------------------------
AI_API_TOKEN = "{{ exec(command='secret-tool lookup service AI_API_TOKEN 2>/dev/null || true', cache_duration=vars.secret_cache_ttl) }}"
GITHUB_TOKEN = "{{ exec(command='secret-tool lookup service GITHUB_TOKEN 2>/dev/null || true', cache_duration=vars.secret_cache_ttl) }}"
BYPASS_GITHUB_TOKEN = "{{ exec(command='secret-tool lookup service BYPASS_GITHUB_TOKEN 2>/dev/null || true', cache_duration=vars.secret_cache_ttl) }}"

