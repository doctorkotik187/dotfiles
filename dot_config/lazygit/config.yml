# Tool: lazygit (https://github.com/jesseduffield/lazygit) — Terminal UI for Git commands

git:
  diffRenderers:
    - command: delta --dark --paging=never
    - command: delta --dark --paging=never --side-by-side

gui:
  showFileTree: false
  # Rose Pine Theme
  theme:
    activeBorderColor:
      - "#3e8fb0"
      - bold
    inactiveBorderColor:
      - "#6e6a86"
    searchingActiveBorderColor:
      - "#ea9a97"
      - bold
    optionsTextColor:
      - "#9ccfd8"
    selectedLineBgColor:
      - "#3e8fb0"
    inactiveViewSelectedLineBgColor:
      - "#393552"
      - bold
    cherryPickedCommitFgColor:
      - "#2a273f"
    cherryPickedCommitBgColor:
      - "#ea9a97"
    markedBaseCommitFgColor:
      - "#9ccfd8"
    markedBaseCommitBgColor:
      - "#f6c177"
    unstagedChangesColor:
      - "#eb6f92"
    defaultFgColor:
      - "#e0def4"
