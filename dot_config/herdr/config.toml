# Tool: herdr (https://herdr.dev/) — Terminal workspace manager for AI coding agents

onboarding = false

[session]
resume_agents_on_restore = false

[terminal]
default_shell       = "/bin/bash"
shell_mode          = "login"

[update]
version_check       = false

[worktrees]
directory           = "~/GIT/.wt"

[theme]
name                = "rose-pine"

[ui]
sidebar_width       = 16
status_indicators   = "symbols"
host_cursor         = "native"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery           = "herdr"
clipboard.position = "top-right"

[keys]
# Panes (WaveTerm: Ctrl+Shift+Arrows / h,j,k,l to move between blocks)
focus_pane_up      = "ctrl+shift+up"
focus_pane_down    = "ctrl+shift+down"
focus_pane_left    = "ctrl+shift+left"
focus_pane_right   = "ctrl+shift+right"

# Tabs (WaveTerm: Alt+[ / Alt+] to switch tabs, Alt+1..9 to switch tab)
previous_tab       = "alt+["
next_tab           = "alt+]"
switch_tab         = "alt+1..9"
move_tab_previous  = "alt+shift+["
move_tab_next      = "alt+shift+]"

# Workspaces (WaveTerm: Alt+Ctrl+1..9 / Cmd+Ctrl for workspaces)
previous_workspace = "alt+ctrl+up"
next_workspace     = "alt+ctrl+down"

# Worktrees
open_worktree      = "prefix+shift+o"

# Agents
previous_agent     = "prefix+A"
next_agent         = "prefix+a"

# Custom Commands
[[keys.command]]
key                = "prefix+y"
type               = "shell"
command            = "herdr pane read $HERDR_ACTIVE_PANE_ID --source recent-unwrapped --lines 2000 | wl-copy"
description        = "yank pane contents to clipboard"
