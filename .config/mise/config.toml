# Tool: mise (https://mise.jdx.dev/) — Dev tool version manager and environment organizer

[settings]
jobs             = 6      # parallel downloads and installs
self_update.auto = true   # automatically keep mise binary up to date
history.enabled  = false  # intentional manual git commits for dotfiles

[vars]
age_key = "~/.config/age/key.txt"

# DOTFILES ###################################################

[dotfiles]
"~/.bashrc/activate" = { block = """
eval "$("$HOME/.local/bin/mise" activate bash)"
[ "$HOSTNAME" != "smolbaby" ] && eval "$(fnox activate bash)"
eval "$(zoxide init bash)"
eval "$(starship init bash)"
""" }

[dotfile_groups.main]
root = "~/.dotfiles"
target = "~"
exclude = [
  ".git",
  "_*",
]

[dotfile_groups.main.entries]
"~/.omp/agent/config.yml" = { mode = "template" }
"~/.gitconfig"            = { mode = "template" }

# ENVIRONMENT & PATH #########################################

[env]
EDITOR              = "nvim"
IGNOREEOF           = 9
COLORTERM           = "truecolor"
STARSHIP_LOG        = "error"
SMOLVM_MACHINE_NAME = "smolbaby"
FNOX_SHELL_OUTPUT   = "none"
BAT_THEME           = "ansi"
FZF_DEFAULT_OPTS    = """
--color=fg:#908caa,bg:#191724,hl:#ebbcba
--color=fg+:#e0def4,bg+:#26233a,hl+:#ebbcba
--color=border:#403d52,header:#31748f,gutter:#191724
--color=spinner:#f6c177,info:#9ccfd8
--color=pointer:#c4a7e7,marker:#eb6f92,prompt:#908caa
"""

_.path = [
  "~/.local/bin",
  "~/.local/share/soar/bin",
]

# SHELL ALIASES ##############################################

[shell_alias]
nv   = "nvim"
gst  = "git status"
lg   = "lazygit"
ff   = "fastfetch"
ll   = "eza -al"
yt-a = "yt-dlp -f 250 -x --audio-format opus --restrict-filenames"
kate = "flatpak run org.kde.kate"
omp  = "fnox exec -- omp"

# TASKS ######################################################

[tasks."smolvm:shell"]
description = "Connect to sandbox VM"
raw = true
run = 'fnox exec -- smolvm machine exec -w "$PWD" -i -t -- bash -l'

[tasks."smolvm:rebuild"]
description = "Rebuild sandbox machine from ~/.config/smolvm/Smolfile"
confirm = { message = "Destroy and rebuild SmolVM sandbox machine?", default = "no" }
run = [
  "smolvm machine stop 2>/dev/null || true",
  "smolvm machine delete -f 2>/dev/null || true",
  "smolvm machine create -s ~/.config/smolvm/Smolfile",
  "fnox exec -- smolvm machine start",
]

[tasks."tools:update"]
description = "Update toolchains and dotfiles"
alias = "update"
run = [
  "mise dot apply",
  "soar update",
  "mise upgrade",
]

[tasks."ssh-config:decrypt"]
description = "Decrypt ~/.ssh/config.local.age to ~/.ssh/config"
run = "age -d -i {{ vars.age_key }} -o ~/.ssh/config ~/.ssh/config.local.age && chmod 600 ~/.ssh/config"

[tasks."ssh-config:encrypt"]
description = "Encrypt ~/.ssh/config to ~/.ssh/config.local.age"
run = "age -a -e -i {{ vars.age_key }} -o ~/.ssh/config.local.age ~/.ssh/config"

