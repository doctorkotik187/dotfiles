# Tool: mise (https://mise.jdx.dev/) — Dev tool version manager and environment organizer

[vars]
email    = "217476020+doctorkotik187@users.noreply.github.com"
git_name = "doctorkotik187"
dk_root  = "/run/media/dk/MEME-HDD/0-doctorkotik"

# TASKS ######################################################

[tasks."syncthing:conflicts"]
description = "Check for unresolved Syncthing conflict files"
run = """
if [ ! -d "{{ vars.dk_root }}" ]; then
    echo "{{ vars.dk_root }} doesn't exist yet, skipping conflict check."
    exit 0
fi
conflicts=$(fd --hidden --no-ignore --ignore-case "conflict" "{{ vars.dk_root }}")
if [ -n "$conflicts" ]; then
    echo "WARNING: syncthing conflict files found:"
    echo "$conflicts"
    exit 1
else
    echo "=== NO SYNCTHING CONFLICTS FOUND ==="
fi
"""

[tasks.update]
description = "Update toolchains, dotfiles, rpm-ostree system, and flatpaks"
raw = true
run = [
  { task = "syncthing:conflicts" },
  { task = "update:tools" },
  "flatpak update -y",
  "rpm-ostree upgrade",
]

[tasks.bootstrap]
description = "Bootstrap fresh Fedora Silverblue machine from scratch"
raw = true
run = [
  { task = "setup:layer" },
  { task = "setup:flatpaks" },
  { task = "setup:ssh-config" },
  { task = "setup:ssh-fido" },
]

[tasks."setup:layer"]
description = "Layer required host packages on Fedora Silverblue via rpm-ostree"
run = "rpm-ostree install -y fuse fuse-libs gcc make"

[tasks."setup:flatpaks"]
description = "Install declarative Flatpak applications via mise"
run = "mise bootstrap packages apply --manager flatpak-user"

[tasks."setup:ssh-fido"]
description = "Import resident SSH keys from a plugged-in FIDO2 key"
raw = true
run = "ssh-keygen -K"

[tasks."setup:ssh-config"]
description = "Deploy personal SSH config from fnox to ~/.ssh/config"
run = """
mkdir -p ~/.ssh && chmod 700 ~/.ssh
fnox get SSH_CONFIG > ~/.ssh/config
chmod 600 ~/.ssh/config
"""

[tasks."kagi:decrypt"]
description = "Decrypt kagi via FIDO2 key to /dev/shm/kagi"
run = "age -d -j fido2-hmac -o /dev/shm/kagi {{ vars.dk_root }}/3-RESOURCES/program-data/old-places/kagi.age"

[tasks."kagi:remove"]
description = "Delete decrypted kagi temp file"
run = "rm -fv /dev/shm/kagi"

# CLI APPS ###################################################

[tools]
"github:pystardust/ani-cli"            = { version = "latest", asset_pattern = "ani-cli" }
"github:olastor/age-plugin-fido2-hmac" = "latest"
"cargo:solo2"                          = "latest"

