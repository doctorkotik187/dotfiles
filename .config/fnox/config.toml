#:schema https://fnox.jdx.dev/schema.json
# Tool: fnox (https://fnox.jdx.dev/) — Secret manager by jdx, the fort knox companion for mise

import = ["./config.local.toml"]
default_provider = "keychain"
env = "exec"

[daemon]
enabled = true

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
AI_TOKEN     = { value = "AI_TOKEN", env = true }
GITHUB_TOKEN = { value = "GITHUB_RATE_LIMIT_TOKEN", env = true }
GH_TOKEN     = { value = "GH_TOKEN" }
